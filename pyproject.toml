[project]
name = "ainsight-backend"
version = "0.1.0"
description = "Minimal runnable backend core for Ainsight AI agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langfuse>=4.0.0",
  "opentelemetry-exporter-otlp>=1.44.0",
  "opentelemetry-sdk>=1.44.0",
  "pydantic-ai>=2.2.0",
  "PyYAML>=6.0",
]

[tool.unittest]
start-directory = "tests"
